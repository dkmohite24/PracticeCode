<template>
    <iframe
    src={url}
    height={height}
    width={width}
    title="techdicer"
  ></iframe>
  
    <lightning-card title="Payment Detailsss" icon-name="standard:currency">
        <div class="slds-m-around_medium">
            <lightning-input
                label="Card Number"
                name="cardNumber"
                type="text"
                value={cardNumber}
                onchange={handleInputChange}
                required>
            </lightning-input>

            <lightning-input
                label="Card Holder"
                name="cardHolder"
                type="text"
                value={cardHolder}
                onchange={handleInputChange}
                required>
            </lightning-input>

            <lightning-input
            type="text"
            label="Date (MM/YY)"
            placeholder="MM/YY"
            value={dateValue}
            onchange={handleInputDateChange}
            onblur={validateDateFormat}
            message-when-bad-input="Please enter a date in MM/YY format"
        ></lightning-input>

            <lightning-input
                label="CVV"
                name="cvv"
                type="password"
                value={cvv}
                onchange={handleInputChange}
                required>
            </lightning-input>

            <lightning-button
                class="slds-m-top_medium"
                variant="brand"
                label="Submit"
                onclick={handleSubmit}>
            </lightning-button>
        </div>
    </lightning-card>
</template>
