<template>
    <lightning-card title="Edit cart">
        <!-- Button to toggle the form visibility -->
        <lightning-button label="Edit Cart" onclick={handleOpenForm} class="slds-m-bottom_small"></lightning-button>

        <!-- Conditionally display the form based on isFormVisible property -->
        <template if:true={isFormVisible}>
            <lightning-record-form
                record-id={recordId}
                object-api-name="Order"
                layout-type="Full"
                mode="edit"
                onsuccess={handleSuccess}
                oncancle={handleCancel}
                hide-buttons>
                
                <lightning-button variant="neutral" label="Cancel1" onclick={handleCancel}></lightning-button>
            </lightning-record-form>

            <div class="slds-m-top_small slds-align_absolute-center">
        
                <lightning-button variant="neutral" label="Close" onclick={handleCancel}></lightning-button>
            </div>
        </template>
    </lightning-card>
    
</template>
